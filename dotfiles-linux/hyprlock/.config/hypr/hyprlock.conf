# ==============================================================================
# HYPRLOCK — Minimal Anime Lock Screen
# Target: 2880x1800 / 14" High-DPI Laptop
# ==============================================================================

source = ~/.config/hypr/colors.conf

# ==============================================================================
# BACKGROUND
# ==============================================================================

background {
    monitor =
    path = $image

    blur_passes = 2
    blur_size = 4

    brightness = 0.72
    contrast = 0.92
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ==============================================================================
# GENERAL
# ==============================================================================

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

# ==============================================================================
# ANIMATIONS
# ==============================================================================

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1

    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeInOutCubic

    animation = inputFieldColors, 1, 4, easeInOutCubic
    animation = inputFieldWidth, 1, 4, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeInOutCubic
}
# ==============================================================================
# HYPRLOCK — Minimal Anime Lock Screen
# Target: 2880x1800 / 14" High-DPI Laptop
# ==============================================================================

source = ~/.config/hypr/colors.conf

# ==============================================================================
# BACKGROUND
# ==============================================================================

background {
    monitor =
    path = $image

    blur_passes = 2
    blur_size = 4

    brightness = 0.72
    contrast = 0.92
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ==============================================================================
# GENERAL
# ==============================================================================

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

# ==============================================================================
# ANIMATIONS
# ==============================================================================

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1

    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeInOutCubic

    animation = inputFieldColors, 1, 4, easeInOutCubic
    animation = inputFieldWidth, 1, 4, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeInOutCubic
}

# ==============================================================================
# DYNAMIC ISLAND — TOP CENTER
# ==============================================================================

shape {
    monitor =

    size = 1180, 80

    color = $surface_container_rgba

    rounding = -1

    border_size = 1
    border_color = $outline_variant_rgba

    position = 0, -50

    halign = center
    valign = top

    zindex = 0
}

label {
    monitor =

    text = cmd[update:2000] ~/.config/hypr/hyprlock/scripts/hyprlock-island.sh

    color = $on_surface

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -76

    halign = center
    valign = top

    text_align = center

    zindex = 1
}

# ==============================================================================
# CENTER STACK
# ==============================================================================

# ------------------------------------------------------------------------------
# CLOCK
# ------------------------------------------------------------------------------

label {
    monitor =

    text = cmd[update:1000] ~/.config/hypr/hyprlock/scripts/hyprlock-clock.sh

    color = $on_background

    font_size = 92
    font_family = JetBrainsMono Nerd Font SemiBold

    position = 0, 190

    halign = center
    valign = center

    text_align = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# DATE
# ------------------------------------------------------------------------------

label {
    monitor =

    text = cmd[update:60000] echo "<span letter_spacing='1500'>$(date +'%A, %d %B' | tr '[:lower:]' '[:upper:]')</span>"

    color = $secondary

    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium

    position = 0, 105

    halign = center
    valign = center

    text_align = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# AVATAR
# ------------------------------------------------------------------------------

image {
    monitor =

    path = ~/.config/hypr/hyprlock/assets/avatar.png

    size = 86

    rounding = -1

    border_size = 2
    border_color = $primary

    position = 0, 18

    halign = center
    valign = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# USERNAME
# ------------------------------------------------------------------------------

label {
    monitor =

    text = $USER

    color = $primary

    font_size = 26
    font_family = JetBrainsMono Nerd Font Medium

    position = 0, -72

    halign = center
    valign = center

    text_align = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# PASSWORD
# ------------------------------------------------------------------------------

input-field {
    monitor =

    size = 440, 52

    outline_thickness = 2

    dots_size = 0.23
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    inner_color = $surface_container_rgba
    outer_color = $outline_variant_rgba

    check_color = $primary
    fail_color = $error

    font_color = $on_surface
    font_family = JetBrainsMono Nerd Font
    font_size = 15

    fade_on_empty = false

    rounding = -1

    placeholder_text = <span alpha="60%">󰌾  Enter Password...</span>

    hide_input = false

    fail_text = <span>$FAIL ($ATTEMPTS)</span>

    position = 0, -145

    halign = center
    valign = center

    zindex = 1
}

# ==============================================================================
# WEATHER — BOTTOM LEFT
# ==============================================================================

shape {
    monitor =

    size = 400, 150

    color = $surface_container_rgba

    rounding = 20

    border_size = 1
    border_color = $outline_variant_rgba

    position = 36, 36

    halign = left
    valign = bottom

    zindex = 0
}

label {
    monitor =

    text = cmd[update:900000] ~/.config/hypr/hyprlock/scripts/hyprlock-weather.sh

    color = $primary

    font_size = 35
    font_family = JetBrainsMono Nerd Font

    position = 100, 75

    halign = left
    valign = bottom

    text_align = center

    zindex = 1
}

# ==============================================================================
# MUSIC PLAYER — BOTTOM CENTER
# ==============================================================================

shape {
    monitor =

    size = 800, 150

    color = $surface_container_rgba

    rounding = 22

    border_size = 1
    border_color = $outline_variant_rgba

    position = 0, 36

    halign = center
    valign = bottom

    zindex = 0
}

# ------------------------------------------------------------------------------
# ALBUM ART
# ------------------------------------------------------------------------------

image {
    monitor =

    path = /tmp/hyprlock-art.png

    size = 100

    rounding = 12

    position = -280, 60

    halign = center
    valign = bottom

    reload_time = 2
    reload_cmd = ~/.config/hypr/hyprlock/scripts/hyprlock-art.sh

    zindex = 1
}

# ------------------------------------------------------------------------------
# SONG TITLE
# ------------------------------------------------------------------------------

label {
    monitor =

    text = cmd[update:2000] ~/.config/hypr/hyprlock/scripts/hyprlock-mpris.sh

    color = $on_surface

    font_size = 17
    font_family = JetBrainsMono Nerd Font Medium

    position = 50, 140

    halign = center
    valign = bottom

    text_align = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# PROGRESS
# ------------------------------------------------------------------------------

label {
    monitor =

    text = cmd[update:1000] ~/.config/hypr/hyprlock/scripts/hyprlock-progress.sh

    color = $primary

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = -30, 95

    halign = center
    valign = bottom

    text_align = center

    zindex = 1
}

# ------------------------------------------------------------------------------
# PREVIOUS
# ------------------------------------------------------------------------------

label {
    monitor =

    text = 󰒮

    color = $on_surface_variant

    font_size = 21
    font_family = JetBrainsMono Nerd Font

    position = 150, 90

    halign = center
    valign = bottom

    onclick = playerctl previous

    zindex = 1
}

# ------------------------------------------------------------------------------
# PLAY / PAUSE
# ------------------------------------------------------------------------------

label {
    monitor =

    text = cmd[update:1000] playerctl status 2>/dev/null | grep -q Playing && echo "󰏤" || echo "󰐊"

    color = $primary

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 200, 90

    halign = center
    valign = bottom

    onclick = playerctl play-pause

    zindex = 1
}

# ------------------------------------------------------------------------------
# NEXT
# ------------------------------------------------------------------------------

label {
    monitor =

    text = 󰒭

    color = $on_surface_variant

    font_size = 21
    font_family = JetBrainsMono Nerd Font

    position = 250, 90

    halign = center
    valign = bottom

    onclick = playerctl next

    zindex = 1
}

